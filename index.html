<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InstaFront</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>InstaFront</h1>
      <input type="text" placeholder="Buscador..." />
      <img class="avatar" src="img/fotoPerfil.png" alt="Perfil" />
    </header>

    <main>
      <section class="contenido">
        <section class="historias">
          <img src="img/fotoPerfil.png" alt="Historia 1" />
          <img src="img/fotoPerfil.png" alt="Historia 2" />
          <img src="img/fotoPerfil.png" alt="Historia 3" />
          <img src="img/fotoPerfil.png" alt="Historia 4" />
          <img class="extra" src="img/fotoPerfil.png" alt="Historia 5" />
          <img class="extra" src="img/fotoPerfil.png" alt="Historia 6" />
          <img class="extra" src="img/fotoPerfil.png" alt="Historia 7" />
        </section>

        <article class="publicacion">
          <div class="encabezado-post">
            <img src="img/fotoPerfil.png" alt="Abril González" />
            <span>Abril González</span>
            <span class="puntos">...</span>
          </div>

          <div class="imagen-post">
            <img src="img/fotoPerfil.png" alt="Publicación de Abril González" />
          </div>

          <div class="datos-post">
            <img
              src="img/Text.png"
              alt="Reacciones y comentarios de la publicación"
            />
          </div>
        </article>
      </section>

      <aside class="sugerencias">
        <div class="perfil-sugerido">
          <img src="img/fotoPerfil.png" alt="Abril González" />
          <span>AbrilGonzalez23</span>
          <a href="#">Cambiar</a>
        </div>

        <p>Sugerencias para ti</p>

        <div class="usuario-sugerido">
          <img src="img/fotoPerfil.png" alt="Jonathan González" />
          <span>Jonathan González</span>
          <a href="#">Seguir</a>
        </div>

        <div class="usuario-sugerido">
          <img src="img/fotoPerfil.png" alt="Gabriela Mancini" />
          <span>Gabriela Mancini</span>
          <a href="#">Seguir</a>
        </div>
      </aside>
    </main>

    <footer>
      <p>Todos los derechos reservados a NOMBRE PROGRAMADOR/A</p>
    </footer>
  </body>
</html>
